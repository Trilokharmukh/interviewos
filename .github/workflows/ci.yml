name: Application checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: interviewos
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: interviewos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://interviewos:disposable_ci_only@localhost:5432/interviewos
      BETTER_AUTH_SECRET: ci-only-disposable-integration-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run build
      - name: Verify accounts and private PostgreSQL persistence
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/interviewos-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/integration/accounts.mjs
